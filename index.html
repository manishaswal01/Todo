<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="background-blobs">
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <div class="app-card">
        <header>
            <h1>My Universe <i class="fas fa-rocket"></i></h1>
            <div class="input-container">
                <input type="text" id="myInput" placeholder="What's your next mission?">
                <!-- Button mein title aur aria-label add kiya gaya hai -->
                <button onclick="newElement()" class="add-btn" title="Add Task" aria-label="Add new task">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </header>

        <ul id="myUL">
            <!-- Dynamic tasks load here -->
        </ul>

        <div class="footer">
            <button class="clear-btn" onclick="clearAll()">
                <i class="fas fa-trash-alt"></i> Clear Universe
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
